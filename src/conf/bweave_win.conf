# ============================================================================
# Blockweave Service Configuration File
# ============================================================================

# network type: mainnet|testnet|localnet.  Default is mainnet
network=localnet

# Miner address (REQUIRED)
# Generate an address using: ./build/wallet
# This address will receive mining rewards
miner_address=ea6dc2ca1bd34a376850629cc74510133b7c2a4c318

# REST API Settings
# Port for the REST API server (default: 28443)
rest_api_port=28443

# Peer-to-Peer Network Settings
# P2P listening port (default: 28333)
p2p_port=28333
# Maximum number of inbound peer connections - peers connecting to us (default: 120)
max_inbound_peers=120
# Maximum number of inbound worker threads for message processing (default: 32)
max_inbound_worker_threads=32
# Maximum number of outbound peer connections - we connect to them (default: 8)
max_outbound_peers=8
# Interval in seconds between sending PING messages to peers for keep-alive (default: 180)
peers_ping_time=180

# STUN Configuration (for public IP discovery)
# Comma-separated list of STUN servers for NAT traversal and public IP discovery
# Used to automatically discover your public IP address if behind NAT
# Default: Google, Mozilla, and StunProtocol.org public STUN servers
#stun_addresses=stun.l.google.com:19302,stun1.l.google.com:19302,stun2.l.google.com:19302,stun3.l.google.com:19302,stun4.l.google.com:19302,stun.stunprotocol.org:3478,stun.services.mozilla.com:3478

# Manual public IP override (optional)
# If set to a non-127.0.0.1 address, disables automatic STUN discovery
# Useful for nodes behind static NAT or with known public IP
# Default: 127.0.0.1 (auto-detect via STUN)
#public_ip=127.0.0.1

# Data directory for blockchain storage (default: ./data)
data_dir=%APPDATA%\bweave\data

# Log directory for blockchain
log_dir=%APPDATA%\bweave\log

# Log level, FATAL->ERROR->WARN->INFO->TRACE
log_level=INFO

# Log file size, default 128MB
log_file_size_in_mb=128

# Log files to keep
log_file_keep=5
